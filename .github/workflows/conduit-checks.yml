name: Conduit API checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run type-check
      - run: npm test -- --list

  integration:
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONDUIT_BASE_URL: ${{ vars.CONDUIT_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require an explicitly configured test target
        run: test -n "$CONDUIT_BASE_URL"
      - run: npm ci
      - name: Run integration tests and summarize each case
        run: |
          # HTTP failure diagnostics may contain request headers. Keep them on the runner.
          report="$RUNNER_TEMP/conduit-results.json"
          status=0
          npx --no-install playwright test --reporter=json > "$report" 2> "$RUNNER_TEMP/conduit-stderr.log" || status=$?
          jq -r '.. | objects | select(has("tests") and has("ok")) | [(if .ok then "PASS" else "FAIL" end), .title] | @tsv' "$report"
          exit "$status"
